[package]
name = "xross-bass-amp"
version = "2.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "xross-bass-amp-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
lv2 = ["dep:truce-lv2"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]

[dependencies]
truce = { version = "*" }
truce-egui = { version = "*"}
truce-clap = { version = "*", optional = true }
truce-vst3 = { version = "*", optional = true }
truce-lv2 = { version = "*", optional = true }
truce-standalone = { version = "*", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }
egui = "0.34.2"
egui_extras = { version = "0.34.2", features = ["svg", "image"] }
image = "0.25.10"

[dev-dependencies]
truce-test = { git = "https://github.com/truce-audio/truce", tag = "v0.49.2" }

[build-dependencies]
truce-build = { git = "https://github.com/truce-audio/truce", tag = "v0.49.2" }

[profile.shell]
inherits = "release"
